name: Prepare or publish npm package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after validation"
        required: true
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm publish --dry-run
      - name: Publish with provenance
        if: github.event_name == 'release' || inputs.publish == true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
