<script type="text/html" data-help-name="shelly-admin-config">
  <p>Gemeinsame Laufzeit für Discovery, Inventar, Schema-2-Persistenz, begrenzte Historie, Gerätebaselines, Peer-Vergleich und abgesicherte Aktionen.</p>
  <p>Die Historie führt sparsame Rohwerte und Zeit-Buckets und erzwingt Aufbewahrungs-, Mengen- und Größenlimits je Gerät. Conservative ist das Standardprofil; Balanced, Sensitive und Custom sind verfügbar. Observation-Kategorien lassen sich getrennt aktivieren.</p>
  <p>Alte 0.1.x-Konfigurationsnodes werden ohne Neuanlage migriert. Fehlende oder leere Zahlenfelder erscheinen mit dokumentierten Standardwerten und werden als Zahlen gespeichert; ein leeres Firmwareprüfungs-Zeitlimit wird zu 2500 ms.</p>
  <p>Für dauerhafte Daten einen <code>localfilesystem</code>-Context-Store wählen. Schema-1-Inventar, -Historie, -Fehler, -Temperatur und -Anomalien werden abschnittsweise migriert; ein beschädigter optionaler Teil verwirft kein gültiges Inventar.</p>
  <p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Trends sind keine garantierte Ausfallvorhersage und ersetzen keine Elektro-, Brand- oder Herstellerschutzmaßnahmen. Abschaltung erfordert exakte Gerätefreigabe und Aktionsmodus; automatisches Wiedereinschalten erfolgt nie.</p>
  <p><strong>Geräte-Einstellungen (0.5.1):</strong> Geräte-Override → Klasse → allgemein. Das Inventar lädt nur beim Reiterwechsel oder über Aktualisieren. Jeder Override kann auf Erben zurückgesetzt werden. Observations/Events enthalten die effektiven Felder <code>notify</code> und <code>deviceClass</code>.</p>
  <p><strong>Geräte-Dropdown und Klassen (0.5.1):</strong> Ein barrierearm bedienbares Dropdown steht direkt über den Details; die separate Button-Liste ist entfernt. Der fette Sortierschlüssel steht in Name/Typ/IP-Reihenfolge vorn; Sortierung und Typ-/Modellfilter bleiben gespeichert. Das breitenbegrenzte Typ-Popover bricht lange Texte innerhalb des Dialogs um. Die gewählte Klasse zeigt effektives Neustartfenster, zugeordnete Geräte und deren nächsten Neustart.</p>
  <p>Inventardetails unterscheiden persistente Speicherung, letzte direkte Erreichbarkeit und den Nachweis des letzten Scans.</p>
</script>
