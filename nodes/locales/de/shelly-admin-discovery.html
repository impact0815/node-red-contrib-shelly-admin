<script type="text/html" data-help-name="shelly-admin-discovery"><p>Erkennt Gen1–Gen4-Geräte über die Gen1- und Gen2+-HTTP-APIs. Vorhandene Geräte werden inkrementell validiert; Vollscans finden Ergänzungen.</p><p>Version 0.2.0 erhält ein Gerät nach Timeout im Inventar. Eine erfolgreiche Discovery-Abfrage schließt genau einen aktiven Fehler, erhält ihn mit Auftretens-/Auflösungszeit und Grund als <code>lastResolvedError</code> und erzeugt ein Cleared-Recovery-Event.</p><p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Nur autorisierte Netze scannen.</p></script>
