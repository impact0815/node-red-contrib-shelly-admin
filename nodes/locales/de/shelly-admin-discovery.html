<script type="text/html" data-help-name="shelly-admin-discovery">
  <p>Erkennt Shelly-Geräte der Generationen 1 und 2+ und pflegt das gemeinsame Inventar. Bei vorhandenem Inventar validiert ein initialer Lauf zuerst bekannte Geräte; geplante Vollscans finden neue Geräte.</p>
  <p><code>msg.mode</code> kann <code>incremental</code>, <code>full</code> oder <code>initial</code> sein. <code>msg.targets</code> kann vorübergehend Einzel-IPs, Bereiche, CIDRs oder mehrere Einträge vorgeben.</p>
  <p>Ausgänge: (1) vollständiges strukturiertes Inventarergebnis, (2) Erkennungs- und Änderungsereignisse, (3) Fehler. Gewöhnliche geschlossene Ports werden zusammengefasst, nicht einzeln als Fehler ausgegeben.</p>
  <p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Inoffizielles, von Shelly und Allterco unabhängiges Community-Projekt; Bereitstellung „wie besehen“. Netzwerkscans dürfen nur in dafür autorisierten Netzen erfolgen.</p>
</script>
