<script type="text/html" data-help-name="shelly-admin-maintenance"><p>Prüft Firmware und führt abgesicherte sequenzielle Updates oder konditionelle Neustarts aus. Dry-run ist Standard; reale Eingangsbefehle benötigen <code>msg.confirm=true</code>.</p><p>Version 0.2.0 erhält unabhängige Firmwareprüfungs-Zeitlimits und die Fortsetzung über alle Geräte. Update- und Neustartanforderungen setzen erwartete Neustartmarker; erfolgreiche Validierung verwendet denselben Recovery-Lebenszyklus und kann einen früheren Erreichbarkeitsfehler genau einmal schließen.</p><p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Stable-Firmware, Dry-run, Pilotgruppe, gestaffelte Beaufsichtigung, Backups und fachgerechte Elektrik verwenden.</p></script>
