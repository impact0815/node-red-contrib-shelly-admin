<script type="text/html" data-help-name="shelly-admin-maintenance">
  <p>Prüft Firmware oder führt abgesicherte, sequenzielle Firmwareupdates und Neustarts aus. Der Probelauf ist Standard. Durch Eingangsnachrichten ausgelöste echte Aktionen erfordern <code>msg.confirm === true</code>.</p>
  <p>Exakte IDs, IPs oder MAC-Adressen im Editor oder in <code>msg.devices</code> auswählen. Eine leere Auswahl bedeutet nie automatisch „alle“, sofern <code>allowAll</code> nicht ausdrücklich gesetzt ist. Bedingungen unterstützen Neustartbedarf, Uptime, freien Speicher und verfügbares Firmwareupdate.</p>
  <p>Updates und Neustarts laufen geräteweise, warten auf erneute Erreichbarkeit und Gesundheitswerte und halten anschließend die Staffelverzögerung ein. Der Zeitplanmodus „Melden“ prüft nur. Automatische Updates benötigen eine eigene explizite Freigabe und deaktivierten Probelauf.</p>
  <p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Firmwareupdates, Neustarts, Relaisaktionen und automatische Abschaltung können Ausfälle, Datenverlust sowie Geräte-, Elektro-, Gebäude- oder Folgeschäden und Kosten verursachen. APIs und Firmware können sich ändern. Zuerst Probelauf, dann kleine Pilotgruppe, gestaffelter und beaufsichtigter Rollout sowie stabile Strom- und Netzwerkversorgung. Inoffizielles, von Shelly und Allterco unabhängiges Community-Projekt; Bereitstellung „wie besehen“.</p>
</script>
