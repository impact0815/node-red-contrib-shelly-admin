<script type="text/html" data-help-name="shelly-admin-maintenance">
  <p>Führt lesende Firmwareprüfungen, abgesicherte Dry-runs, serielle Firmwareupdates und Neustarts mit Nachvalidierung aus.</p>
  <h3>Eingang / Aktionen</h3>
  <p><code>msg.action</code>: <code>start</code> (konfigurierte Aktion), <code>check</code>, <code>update</code>, <code>reboot</code>, <code>cancel</code> oder <code>status</code>. Exakte IDs/IPs/MACs in <code>msg.devices</code> wählen; leere Auswahl bleibt gesperrt, außer <code>allowAll:true</code>. Echte Updates/Reboots erfordern <code>dryRun:false</code> und <code>confirm:true</code>. Stable-only ist Standard; Beta verlangt <code>firmwarePolicy:"allow-beta"</code>.</p>
  <p>Die Geräteübersicht zeigt die effektive Geräteklasse, aktive Overrides und Notiz/Bezeichnung. Gerätebezogene Firmware- und Auto-Neustart-Policies werden vor jeder Änderung aufgelöst.</p>
  <h3>Ausgänge</h3>
  <ol><li>Abschluss mit Geräteergebnissen, Firmwarebewertung, Validierung, Recovery und Completion.</li><li>Start-/Geräte-/Warte-/Abbruch-/Abschlussfortschritt mit <code>runId</code>, Zustand und Zählern.</li><li>Strukturierte Fehler mit effektiven Zeitlimits.</li></ol>
  <p>Ein Update prüft zuerst jedes ausgewählte Gerät. Der Fortschritt weist geprüft, berechtigt, übersprungen, aktualisiert, fehlgeschlagen und Zeitlimits aus; nur policy-berechtigte Kandidaten durchlaufen Update, Staffelung und Validierung. Der Dry-run liefert <code>plannedUpdates</code> ohne Änderung oder Wartezeit. Geräte ohne berechtigtes Update enden als <code>skipped</code>/<code>no-policy-eligible-update</code>.</p>
  <p>Prüfungen laufen nach einzelnen Fehlern/Timeouts weiter. Update/Reboot läuft seriell, markiert erwartete Neustarts und validiert Recovery. Cancel beendet HTTP-Requests, Validierung und Staffelwartezeit und verhindert neue Gerätearbeit. Eine bereits vom Gerät angenommene Aktion ist nicht rückrollbar; aktuelles Gerät und Termination-Datensatz prüfen.</p>
  <p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Dry-run, ein Pilotgerät, stabile Versorgung/Netz und Beaufsichtigung verwenden.</p>
  <p><strong>Geräte-Dropdown und Klassen:</strong> Ein barrierearm bedienbares Dropdown steht direkt über den Details; die separate Button-Liste ist entfernt. Der fette Sortierschlüssel steht in Auswahl und Liste vorn (Name/Typ/IP-Reihenfolge); Sortierung sowie Typ-/Statusfilter bleiben gespeichert. Das Typ-Popover bleibt breitenbegrenzt im Dialog und bricht lange Texte um. Klassenweite Prüfung, Aktualisierung und Neustart behalten Dry-Run-, Bestätigungs- und rollierende Sicherheitsregeln.</p>
  <p>Erreichbarkeitsfilter verwenden den letzten direkten Abruf; die Offline-Benachrichtigungsbestätigung bleibt getrennt entprellt.</p>
</script>
