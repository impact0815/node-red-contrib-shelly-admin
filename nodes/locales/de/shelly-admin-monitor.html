<script type="text/html" data-help-name="shelly-admin-monitor">
  <p>Fragt inventarisierte Geräte nach Erreichbarkeit, Antwortzeit, Temperatur, Overtemperature, WLAN-RSSI, Uptime, Speicher, Firmwarestatus und verfügbaren elektrischen Messwerten ab.</p>
  <p>Die Historie ist begrenzt und aggregiert. Frühwarnungen vergleichen aktuelle Werte transparent mit Median/MAD der eigenen Historie und – bei genügend vergleichbaren Geräten – mit Peer-Medianen. Jede Beobachtung enthält Gründe, Baseline, Abweichung, Vertrauen und Datenqualität. Es gibt keinen undurchsichtigen Gesamtscore und keine garantierte Ausfallvorhersage.</p>
  <p>Firmware- und Konfigurationswechsel starten eine Warm-up-Phase. Mindestdatenmenge, aufeinanderfolgende Abweichungen, Hysterese, Cooldown und Behandlung fehlender Werte begrenzen Fehlalarme.</p>
  <p><strong>Temperatursicherheit:</strong> Zuerst wird gemeldet. Ein Ausgang wird nur im Aktionsmodus und nur bei exakter Geräterichtlinie mit <code>autoShutdown:true</code> ausgeschaltet. Kein automatisches Wiedereinschalten.</p>
  <p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Kein zertifiziertes Brandschutzsystem und kein Ersatz für Rauchmelder, Schutzgeräte, Beaufsichtigung oder fachgerechte Elektroinstallation. Inoffizielles, von Shelly und Allterco unabhängiges Community-Projekt; Bereitstellung „wie besehen“.</p>
</script>
