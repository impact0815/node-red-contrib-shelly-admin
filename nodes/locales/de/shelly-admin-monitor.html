<script type="text/html" data-help-name="shelly-admin-monitor">
  <p>Fragt das persistente Inventar ab und liefert Observation-Schema-2-Datensätze. Verfügbar sind Nur aktueller Zustand, Nur Übergänge sowie Aktueller Zustand und Übergänge. Die vorhandenen Ausgänge Gesundheit, Hinweise und Fehler bleiben erhalten.</p>
  <p>Primär sind Median-/MAD-/Perzentil-Baselines des Geräts. Vorsichtige Peers, Mindestdaten, Warm-up, aufeinanderfolgende Auslösungs-/Entwarnwerte, Cooldown, Coverage und Missing-Value-Behandlung verringern Fehlalarme.</p>
  <p>Recovery, Latenz, Temperaturtrend, Neustartmuster, Ressourcen und konservative elektrische Beobachtungen verwenden <code>opened</code>, <code>present</code>, <code>updated</code>, <code>cleared</code> und <code>suppressed</code>. Statische Temperatursicherheit bleibt getrennt.</p>
  <p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Trends sind keine garantierte Ausfallvorhersage. Abschaltung erfordert exakte Gerätefreigabe und Aktionsmodus; automatisches Wiedereinschalten erfolgt nie.</p>
</script>
