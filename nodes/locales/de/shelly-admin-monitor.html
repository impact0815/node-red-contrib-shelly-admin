<script type="text/html" data-help-name="shelly-admin-monitor">
  <p>Fragt das Inventar ab und erzeugt Health, begrenzte Historie, Recovery-, Firmware-, Temperatur-, Anomalie- und Trend-Observations für Shelly Gen1–Gen4.</p>
  <h3>Editorbereiche</h3>
  <p>Der normale Bearbeitungsdialog enthält vier funktionsfähige Tabs: <strong>Einstellungen</strong>, <strong>Aktuelle Befunde</strong>, <strong>Historie</strong> und <strong>Gerätedetails</strong>. Die drei Ergebnis-Tabs lesen den letzten deployten Runtime-Zustand über mit <code>shelly-admin.read</code> geschützte Admin-Endpunkte, aktualisieren sich im aktiven Tab und geben keine Zugangsdaten aus.</p>
  <ul><li><strong>Aktuelle Befunde</strong> gruppiert Firmware, Temperatur, Offline/Recovery, Trends, Ressourcen und elektrische Beobachtungen. Jede Karte enthält Schweregrad, verständlichen Titel und Erklärung, Gerät/Modell, IP, aktuellen Wert, Baseline oder Zielversion, Lifecycle und Zeitpunkt. Kritisch, Warnung, Info und Behoben sind visuell getrennt.</li><li><strong>Historie</strong> zeigt begrenzt und neueste zuerst die Zustände und Übergänge opened, updated, present, cleared und Recovery anstelle von Rohmesswerten.</li><li><strong>Gerätedetails</strong> bietet eine Inventarauswahl und sichere Identität, Modell, Generation, IP, Erreichbarkeit, Firmware, Temperatur, Latenz, Ressourcen, aktive Befunde, aufgelöste Fehler und verfügbare Baselines. Fehlende Werte erscheinen als Nicht verfügbar, nie als Nullwert.</li></ul>
  <h3>Eingang / Aktionen</h3>
  <p><code>msg.action</code>: <code>start</code>/<code>poll</code>/<code>check</code>, <code>cancel</code>, <code>status</code>, <code>enable</code>, <code>disable</code>, <code>refresh-device</code>, <code>wait-device</code> oder bestätigtes <code>remove-device</code>. Einmallauf-Overrides: <code>automationMode</code>, <code>firmwarePolicy</code>, <code>outputMode</code>. Enable/disable schaltet den Intervalltimer bis zum Deploy. Editor-Schaltflächen nutzen dieselbe API.</p>
  <p>Jede Observation enthält <code>notify</code> und <code>deviceClass</code>. Die Gerätedetails zeigen Klasse, aktive Overrides und Notiz/Bezeichnung.</p>
  <h3>Ausgänge</h3>
  <ol><li>Health/Ergebnis mit Geräten, historiengestützter Zusammenfassung, Aktionen, Lifecycle, <code>summaryText</code>, <code>summaryTextDe</code>, <code>humanSummary</code>, <code>findingsSummary</code> und gruppierten <code>cards</code>.</li><li>Alerts mit denselben kompakten Befundfeldern sowie Fortschritts-/Lifecycle-Topics. Observation-Lifecycles: opened, present, updated, cleared, suppressed.</li><li>Strukturierte Fehler.</li></ol>
  <p>Reine Beta-Informationen sind bei Stable-only informativ und keine Warnung. Reguläre Nullleistungsphasen und übliche Aus-/Lastzyklen öffnen keine elektrische Anomalie; aktive Lastabweichungen brauchen ausreichende aktive Historie, korrelierte Leistungs-/Ratenbefunde werden zusammengeführt.</p>
  <p>Automatische Abschaltung verlangt Actions-Modus und exakte Geräterichtlinie <code>temperature.autoShutdown:true</code>. Kein automatisches Wiedereinschalten.</p>
  <p><strong>⚠️ Nutzung auf eigene Gefahr – keine Gewährleistung.</strong> Monitoring ist kein zertifizierter Brandschutz und keine garantierte Ausfallprognose.</p>
  <p><strong>Geräte-Dropdown:</strong> Die separate Geräte-Button-Liste ist entfernt. Ein per Tastatur bedienbares Dropdown steht direkt über den Details. Es zeigt <code>Name · Typ · IP</code>, <code>Typ · Name · IP</code> oder <code>IP · Name · Typ</code>, der führende Schlüssel ist fett. Das breitenbegrenzte Typ-/Modell-Popover bricht lange Auswahltexte um und bleibt im Dialog; Filter und Sortierung werden je Ansicht gespeichert. Aktualisieren erhält Filter, Auswahl und Scrollposition.</p>
  <p><strong>Direkte Aktionen:</strong> Alle Daten neu laden fragt das gewählte Gerät frisch ab. Bei Nichterreichbarkeit stehen Erneut versuchen, begrenztes Retry/Warten und bestätigtes Entfernen bereit. Klassen-/Override-Konfiguration bleibt für sichere Wiedererkennung erhalten.</p>
</script>
