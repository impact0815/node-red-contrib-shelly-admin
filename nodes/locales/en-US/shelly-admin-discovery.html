<script type="text/html" data-help-name="shelly-admin-discovery"><p>Discovers Gen1–Gen4 devices through Gen1 and Gen2+ HTTP APIs. Existing inventory is validated incrementally; full scans find additions.</p><p>Version 0.2.0 keeps a timed-out device in inventory. A successful discovery probe closes one active error, preserves it as <code>lastResolvedError</code> with occurrence/resolution times and reason, and emits one cleared recovery event.</p><p><strong>⚠️ Use at your own risk – no warranty.</strong> Scan only authorized networks.</p></script>
