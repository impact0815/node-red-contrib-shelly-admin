<script type="text/html" data-help-name="shelly-admin-maintenance"><p>Checks firmware and performs guarded sequential updates or conditional reboots. Dry-run is the default; real input-triggered actions require <code>msg.confirm=true</code>.</p><p>Version 0.2.0 retains independent firmware-check timeouts and full-fleet continuation. Update and reboot requests create expected-restart markers; successful validation uses the shared recovery lifecycle and can clear an earlier reachability error exactly once.</p><p><strong>⚠️ Use at your own risk – no warranty.</strong> Use stable firmware, dry-run, a pilot group, staged supervised rollout, backups and professional electrical installation.</p></script>
