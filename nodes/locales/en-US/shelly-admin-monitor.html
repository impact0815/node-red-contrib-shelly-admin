<script type="text/html" data-help-name="shelly-admin-monitor">
  <p>Polls inventory and produces health, bounded history, recovery, firmware, temperature, anomaly and trend observations for Shelly Gen1–Gen4.</p>
  <h3>Editor views</h3>
  <p>The normal edit dialog provides four functional tabs: <strong>Settings</strong>, <strong>Current Findings</strong>, <strong>History</strong> and <strong>Device Details</strong>. The three result tabs read the latest deployed runtime state through <code>shelly-admin.read</code>-protected Admin endpoints, refresh while selected and expose no credentials.</p>
  <ul><li><strong>Current Findings</strong> groups Firmware, Temperature, Offline/Recovery, Trends, Resources and Electrical observations. Every card includes severity, a plain-language title and explanation, device/model, IP, current value, baseline or target version, lifecycle and time. Critical, Warning, Info and Cleared are visually distinct.</li><li><strong>History</strong> shows a bounded latest-first list of opened, updated, present, cleared and Recovery entries instead of raw measurements.</li><li><strong>Device Details</strong> offers an inventory selector and safe identity, model, generation, IP, reachability, firmware, temperature, latency, resources, active findings, resolved errors and available baselines. Missing values are shown as Not available, never as zero.</li></ul>
  <h3>Input / actions</h3>
  <p><code>msg.action</code>: <code>start</code>/<code>poll</code>/<code>check</code>, <code>cancel</code>, <code>status</code>, <code>enable</code>, <code>disable</code>, <code>refresh-device</code>, <code>wait-device</code>, or confirmed <code>remove-device</code>. Per-run overrides: <code>automationMode</code>, <code>firmwarePolicy</code>, <code>outputMode</code>. Enable/disable changes the periodic timer until redeploy. Editor buttons invoke the same deployed-node API.</p>
  <p>Every observation includes <code>notify</code> and <code>deviceClass</code>. Device Details shows class, active overrides and note/label.</p>
  <h3>Outputs</h3>
  <ol><li>Health/result with devices, history-driven summary, actions, lifecycle, <code>summaryText</code>, <code>summaryTextDe</code>, <code>humanSummary</code>, <code>findingsSummary</code> and grouped <code>cards</code>.</li><li>Alerts plus the same compact findings fields and progress/lifecycle topics. Observation lifecycles are opened, present, updated, cleared and suppressed.</li><li>Structured errors.</li></ol>
  <p>Stable-only beta information is informational, not a warning. Regular zero-power phases and ordinary off/load cycles do not open electrical anomalies; sustained active-load changes require sufficient active history and correlated power/rate findings are consolidated.</p>
  <p>Automatic shutdown requires Actions mode and an exact per-device <code>temperature.autoShutdown:true</code> policy. No automatic re-enable occurs.</p>
  <p><strong>⚠️ Use at your own risk – no warranty.</strong> Monitoring is not certified fire protection and does not guarantee failure prediction.</p>
  <p><strong>Device dropdown:</strong> the separate device button list is removed. One keyboard-accessible dropdown is followed directly by details. It shows <code>Name · Type · IP</code>, <code>Type · Name · IP</code>, or <code>IP · Name · Type</code>, with the leading key bold. The width-bounded type/model popover wraps long choices and remains inside the dialog; filter and sort are stored per view. Refresh keeps filters, selection and scroll.</p>
  <p><strong>Direct actions:</strong> Reload all data probes the selected device. If unreachable, Retry, bounded Retry/Wait and confirmed Remove are offered. Remove retains class/override configuration for safe rediscovery.</p>
</script>
