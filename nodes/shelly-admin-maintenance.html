<script type="text/javascript">
  (function () {
    function text(context, key, fallback) {
      var translated;
      try {
        if (context && typeof context._ === "function") translated = context._(key);
        if ((!translated || translated === key) && typeof RED._ === "function") translated = RED._(key);
      } catch (_error) {
        translated = null;
      }
      return translated && translated !== key ? translated : fallback;
    }
    function german() {
      return Boolean(RED.settings && /^de(?:-|$)/i.test(RED.settings.lang || ""));
    }
    function label(node, key, english, deutsch) {
      return text(node, "shelly-admin-maintenance." + key, german() ? deutsch : english);
    }
    function missing(node) {
      return label(node, "common.unavailable", "Not available", "Nicht verfügbar");
    }
    function display(node, value, unit) {
      if (value === null || value === undefined || value === "") return missing(node);
      return String(value) + (unit ? " " + unit : "");
    }
    function timestampText(node, value) {
      if (!value) return missing(node);
      var parsed = new Date(value);
      return isNaN(parsed.getTime()) ? String(value) : parsed.toLocaleString();
    }
    function booleanText(node, value, trueEnglish, trueGerman, falseEnglish, falseGerman) {
      if (value === null || value === undefined) return missing(node);
      return value ? (german() ? trueGerman : trueEnglish) : (german() ? falseGerman : falseEnglish);
    }
    function postAction(node, request) {
      $.ajax({
        url: "shelly-admin/nodes/" + encodeURIComponent(node.id) + "/action",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify(request)
      }).done(function (result) {
        RED.notify(result.accepted === false ? label(node, "notify.noRun", "No active run", "Kein aktiver Lauf") : label(node, "notify.sent", "Maintenance action requested", "Wartungsaktion angefordert"), result.accepted === false ? "warning" : "success");
      }).fail(function (xhr) {
        var body = xhr.responseJSON || {};
        RED.notify(body.error && body.error.message || label(node, "notify.deploy", "Deploy the node before using editor controls.", "Node vor der Editor-Bedienung deployen."), "error");
      });
    }
    function addDefinition(host, term, value) {
      $("<dt>").text(term).appendTo(host);
      $("<dd>").text(value).appendTo(host);
    }
    function setState(node, id, state, message) {
      var host = $(id).empty().attr("data-state", state);
      $("<div>").addClass("shelly-view-state shelly-view-state-" + state).text(message).appendTo(host);
      return host;
    }
    function viewState(selector) {
      var host = $(selector);
      return { scrollTop: typeof host.scrollTop === "function" ? host.scrollTop() : 0 };
    }
    function restoreViewState(selector, state) {
      var host = $(selector);
      if (state && typeof host.scrollTop === "function") host.scrollTop(state.scrollTop || 0);
    }
    function stateLabel(node, value) {
      var labels = {
        started: ["Started", "Gestartet"], running: ["Running", "Läuft"], completed: ["Completed", "Abgeschlossen"],
        "completed-with-issues": ["Completed with issues", "Mit Problemen abgeschlossen"], cancelled: ["Cancelled", "Abgebrochen"],
        failed: ["Failed", "Fehlgeschlagen"], updated: ["Updated", "Aktualisiert"], skipped: ["Skipped", "Übersprungen"],
        eligible: ["Eligible", "Berechtigt"], planned: ["Planned", "Geplant"], "dry-run": ["Dry-run", "Probelauf"]
      };
      var pair = labels[value];
      return pair ? pair[german() ? 1 : 0] : display(node, value);
    }
    function renderStatus(node, result) {
      var host = $("#node-input-maintenance-status").empty().attr("data-state", "ready");
      var active = result.run;
      $("<div>").addClass("shelly-maintenance-summary").text(result.active ? label(node, "statusView.active", "Maintenance run active", "Wartungslauf aktiv") : label(node, "statusView.idle", "No maintenance run is active", "Kein Wartungslauf aktiv")).appendTo(host);
      var fields = $("<dl>").addClass("shelly-maintenance-fields").appendTo(host);
      addDefinition(fields, label(node, "statusView.state", "State", "Status"), stateLabel(node, active && active.state));
      addDefinition(fields, label(node, "statusView.action", "Action", "Aktion"), display(node, active && active.action));
      addDefinition(fields, label(node, "statusView.phase", "Phase", "Phase"), display(node, active && active.phase));
      addDefinition(fields, label(node, "statusView.started", "Started", "Gestartet"), timestampText(node, active && active.startedAt));
      addDefinition(fields, label(node, "statusView.progress", "Progress", "Fortschritt"), active ? display(node, active.processed) + " / " + display(node, active.total) : missing(node));
      addDefinition(fields, label(node, "statusView.currentDevice", "Current device", "Aktuelles Gerät"), active && active.currentDevice ? [active.currentDevice.name || active.currentDevice.model || active.currentDevice.id || missing(node), active.currentDevice.ip || missing(node)].join(" · ") : missing(node));
      var latest = result.latestRun;
      $("<h4>").text(label(node, "statusView.latest", "Latest completed run", "Letzter abgeschlossener Lauf")).appendTo(host);
      if (!latest) {
        $("<div>").addClass("shelly-view-state shelly-view-state-empty").text(label(node, "statusView.noLatest", "No completed maintenance run is available.", "Kein abgeschlossener Wartungslauf verfügbar.")).appendTo(host);
        return;
      }
      var latestFields = $("<dl>").addClass("shelly-maintenance-fields").appendTo(host);
      addDefinition(latestFields, label(node, "statusView.action", "Action", "Aktion"), display(node, latest.action));
      addDefinition(latestFields, label(node, "statusView.state", "State", "Status"), stateLabel(node, latest.state));
      addDefinition(latestFields, label(node, "statusView.completed", "Completed", "Abgeschlossen"), timestampText(node, latest.completedAt || latest.timestamp));
      addDefinition(latestFields, label(node, "statusView.summary", "Summary", "Zusammenfassung"), german() ? latest.summaryTextDe || latest.summaryText || missing(node) : latest.summaryText || missing(node));
    }
    function loadStatus(node, preserve) {
      var state = preserve ? viewState("#node-input-maintenance-status") : null;
      setState(node, "#node-input-maintenance-status", "loading", label(node, "statusView.loading", "Loading current status…", "Aktueller Status wird geladen…"));
      $.ajax({ url: "shelly-admin/nodes/" + encodeURIComponent(node.id) + "/maintenance/status", type: "GET", dataType: "json", cache: false })
        .done(function (result) { renderStatus(node, result || {}); restoreViewState("#node-input-maintenance-status", state); })
        .fail(function (xhr) {
          var body = xhr.responseJSON || {};
          setState(node, "#node-input-maintenance-status", "error", body.error && body.error.message || label(node, "statusView.loadError", "Could not load maintenance status.", "Wartungsstatus konnte nicht geladen werden."));
        });
    }
    function filterMatches(device, filter) {
      return filter === "all" || Boolean(device.filters && device.filters[filter]);
    }
    function formatDuration(seconds) {
      var value = Number(seconds);
      if (!Number.isFinite(value)) return "—";
      var days = Math.floor(value / 86400);
      var hours = Math.floor((value % 86400) / 3600);
      var minutes = Math.floor((value % 3600) / 60);
      return [days ? days + " d" : null, hours ? hours + " h" : null, !days && minutes ? minutes + " min" : null].filter(Boolean).join(" ") || "0 min";
    }
    function renderDeviceDetail(node, device) {
      var host = $("#node-input-maintenance-device-detail").empty();
      if (!device) {
        $("<div>").addClass("shelly-view-state shelly-view-state-empty").text(label(node, "devices.noSelection", "No matching device is selected.", "Kein passendes Gerät ist ausgewählt.")).appendTo(host);
        return;
      }
      $("<h4>").text(device.name || device.model || device.id || missing(node)).appendTo(host);
      var fields = $("<dl>").addClass("shelly-maintenance-fields").appendTo(host);
      addDefinition(fields, label(node, "devices.model", "Device name / model", "Gerätename / Modell"), [device.name, device.model].filter(Boolean).join(" / ") || missing(node));
      addDefinition(fields, label(node, "devices.id", "Device ID", "Geräte-ID"), display(node, device.id));
      addDefinition(fields, label(node, "devices.ip", "IP address", "IP-Adresse"), display(node, device.ip));
      addDefinition(fields, label(node, "devices.generation", "Generation", "Generation"), display(node, device.generation));
      addDefinition(fields, label(node, "devices.reachability", "Reachability", "Erreichbarkeit"), booleanText(node, device.reachable, "Online", "Online", "Offline", "Offline"));
      addDefinition(fields, label(node, "devices.uptime", "Current uptime", "Aktuelle Uptime"), device.uptimeSec === null || device.uptimeSec === undefined ? missing(node) : formatDuration(device.uptimeSec));
      addDefinition(fields, label(node, "devices.scheduledReboot", "Scheduled reboot", "Geplanter Neustart"), device.scheduledReboot ? [device.scheduledReboot.enabled ? (german() ? "Aktiv" : "Enabled") : (german() ? "Aus" : "Disabled"), device.scheduledReboot.due ? (german() ? "Fällig" : "Due") : stateLabel(node, device.scheduledReboot.reason), device.scheduledReboot.dueAt ? timestampText(node, device.scheduledReboot.dueAt) : missing(node)].join(" · ") : missing(node));
      addDefinition(fields, label(node, "devices.lastScheduledReboot", "Last scheduled reboot", "Letzter geplanter Neustart"), device.scheduledReboot && device.scheduledReboot.lastAttemptAt ? timestampText(node, device.scheduledReboot.lastAttemptAt) + " · " + stateLabel(node, device.scheduledReboot.lastResult) : missing(node));
      addDefinition(fields, label(node, "devices.currentFirmware", "Current firmware", "Aktuelle Firmware"), display(node, device.currentFirmware));
      addDefinition(fields, label(node, "devices.stableFirmware", "Available stable firmware", "Verfügbare Stable-Firmware"), display(node, device.stableFirmware));
      addDefinition(fields, label(node, "devices.betaFirmware", "Available beta firmware", "Verfügbare Beta-Firmware"), display(node, device.betaFirmware));
      addDefinition(fields, label(node, "devices.policy", "Firmware policy", "Firmware-Richtlinie"), display(node, device.firmwarePolicy));
      addDefinition(fields, label(node, "devices.eligible", "Update eligibility", "Updateberechtigung"), booleanText(node, device.updateEligible, "Eligible", "Berechtigt", "Not eligible", "Nicht berechtigt"));
      addDefinition(fields, label(node, "devices.selectedTarget", "Selected update target", "Ausgewähltes Updateziel"), device.selectedVersion ? [device.selectedChannel || missing(node), device.selectedVersion].join(" · ") : missing(node));
      addDefinition(fields, label(node, "devices.lastCheckStatus", "Last firmware check status", "Status des letzten Firmwarechecks"), stateLabel(node, device.lastFirmwareCheck && device.lastFirmwareCheck.status));
      addDefinition(fields, label(node, "devices.lastCheckAt", "Last firmware check", "Letzter Firmwarecheck"), timestampText(node, device.lastFirmwareCheck && device.lastFirmwareCheck.at));
      addDefinition(fields, label(node, "devices.lastUpdate", "Last firmware update", "Letztes Firmwareupdate"), device.lastFirmwareUpdate ? timestampText(node, device.lastFirmwareUpdate.at) + " · " + stateLabel(node, device.lastFirmwareUpdate.status) + " · " + display(node, device.lastFirmwareUpdate.result) : missing(node));
      addDefinition(fields, label(node, "devices.lastSuccessful", "Last successful update", "Letztes erfolgreiches Update"), device.lastSuccessfulUpdate ? timestampText(node, device.lastSuccessfulUpdate.at) + " · " + display(node, device.lastSuccessfulUpdate.result) : missing(node));
      addDefinition(fields, label(node, "devices.lastFailed", "Last failed update attempt", "Letzter fehlgeschlagener Updateversuch"), device.lastFailedUpdate ? timestampText(node, device.lastFailedUpdate.at) + " · " + display(node, device.lastFailedUpdate.result) : missing(node));
      addDefinition(fields, label(node, "devices.error", "Error / timeout", "Fehler / Zeitüberschreitung"), device.error ? [device.error.code || missing(node), device.error.message || missing(node), device.error.timeoutMs === null || device.error.timeoutMs === undefined ? null : device.error.timeoutMs + " ms"].filter(Boolean).join(" · ") : missing(node));
      addDefinition(fields, label(node, "devices.recovery", "Recovery after update", "Recovery nach Update"), device.recoveryAfterUpdate ? booleanText(node, device.recoveryAfterUpdate.reachable, "Reachable", "Erreichbar", "Not reachable", "Nicht erreichbar") + " · " + timestampText(node, device.recoveryAfterUpdate.checkedAt) : missing(node));
      addDefinition(fields, label(node, "devices.maintenance", "Maintenance run", "Wartungslauf"), device.maintenance ? [device.maintenance.active ? (german() ? "Aktiv" : "Active") : stateLabel(node, device.maintenance.state), device.maintenance.action || missing(node), timestampText(node, device.maintenance.startedAt || device.maintenance.completedAt)].join(" · ") : missing(node));
    }
    function renderDevices(node, result, state) {
      node._shellyMaintenanceDeviceData = result || {};
      var host = $("#node-input-maintenance-devices").empty().attr("data-state", result.empty ? "empty" : "ready");
      var filter = state && state.filter || $("#node-input-maintenance-filter").val() || "all";
      $("#node-input-maintenance-filter").val(filter);
      var devices = (result.devices || []).filter(function (device) { return filterMatches(device, filter); });
      var summary = result.summary || {};
      $("<div>").addClass("shelly-maintenance-summary").text([
        display(node, summary.total) + " " + label(node, "devices.total", "devices", "Geräte"),
        display(node, summary.updateAvailable) + " " + label(node, "filters.updateAvailable", "update available", "Update verfügbar"),
        display(node, summary.error) + " " + label(node, "filters.error", "errors", "Fehler"),
        display(node, summary.offline) + " offline",
        display(node, summary.rebootDue) + " " + label(node, "filters.rebootDue", "reboot due", "Neustart fällig")
      ].join(" · ")).appendTo(host);
      if (!devices.length) {
        $("<div>").addClass("shelly-view-state shelly-view-state-empty").text(label(node, "devices.empty", "No devices match this filter.", "Keine Geräte entsprechen diesem Filter.")).appendTo(host);
        renderDeviceDetail(node, null);
        return;
      }
      var selected = state && state.selected || node._shellyMaintenanceSelectedDeviceId;
      if (!devices.some(function (device) { return String(device.id) === String(selected); })) selected = devices[0].id;
      node._shellyMaintenanceSelectedDeviceId = selected;
      devices.forEach(function (device) {
        var button = $("<button>").attr("type", "button").attr("data-device-id", device.id).addClass("red-ui-button shelly-maintenance-device-row");
        if (String(device.id) === String(selected)) button.addClass("selected");
        $("<strong>").text(device.name || device.model || device.id || missing(node)).appendTo(button);
        $("<span>").text([device.ip || missing(node), booleanText(node, device.reachable, "Online", "Online", "Offline", "Offline"), device.currentFirmware || missing(node), device.updateEligible ? label(node, "filters.updateAvailable", "Update available", "Update verfügbar") : device.scheduledReboot && device.scheduledReboot.due ? label(node, "filters.rebootDue", "Reboot due", "Neustart fällig") : stateLabel(node, device.maintenance && device.maintenance.deviceStatus)].join(" · ")).appendTo(button);
        button.on("click.shellyAdmin", function () {
          node._shellyMaintenanceSelectedDeviceId = $(this).attr("data-device-id");
          $(".shelly-maintenance-device-row").toggleClass("selected", false);
          $(this).toggleClass("selected", true);
          var chosen = (node._shellyMaintenanceDeviceData.devices || []).find(function (item) { return String(item.id) === String(node._shellyMaintenanceSelectedDeviceId); });
          renderDeviceDetail(node, chosen);
        });
        button.appendTo(host);
      });
      renderDeviceDetail(node, devices.find(function (device) { return String(device.id) === String(selected); }));
    }
    function loadDevices(node, preserve) {
      var state = preserve ? {
        filter: $("#node-input-maintenance-filter").val() || "all",
        selected: node._shellyMaintenanceSelectedDeviceId,
        scroll: viewState("#node-input-maintenance-devices")
      } : { filter: $("#node-input-maintenance-filter").val() || "all", selected: node._shellyMaintenanceSelectedDeviceId };
      setState(node, "#node-input-maintenance-devices", "loading", label(node, "devices.loading", "Loading device overview…", "Geräteübersicht wird geladen…"));
      $.ajax({ url: "shelly-admin/nodes/" + encodeURIComponent(node.id) + "/maintenance/devices", type: "GET", dataType: "json", cache: false })
        .done(function (result) { renderDevices(node, result || {}, state); restoreViewState("#node-input-maintenance-devices", state.scroll); })
        .fail(function (xhr) {
          var body = xhr.responseJSON || {};
          setState(node, "#node-input-maintenance-devices", "error", body.error && body.error.message || label(node, "devices.loadError", "Could not load the device overview.", "Geräteübersicht konnte nicht geladen werden."));
        });
    }
    function renderHistory(node, result) {
      var host = $("#node-input-maintenance-history").empty().attr("data-state", result.empty ? "empty" : "ready");
      if (!result.entries || !result.entries.length) {
        $("<div>").addClass("shelly-view-state shelly-view-state-empty").text(label(node, "history.empty", "No maintenance runs have been recorded yet.", "Noch keine Wartungsläufe aufgezeichnet.")).appendTo(host);
        return;
      }
      $("<div>").addClass("shelly-maintenance-summary").text(label(node, "history.summary", "Showing the latest", "Angezeigt werden die letzten") + " " + result.entries.length + " / " + result.totalAvailable).appendTo(host);
      result.entries.forEach(function (run) {
        var card = $("<article>").addClass("shelly-maintenance-run-card shelly-run-" + (run.state || "unknown")).appendTo(host);
        $("<strong>").text([display(node, run.action), stateLabel(node, run.state), run.dryRun ? (german() ? "Probelauf" : "Dry-run") : ""].filter(Boolean).join(" · ")).appendTo(card);
        $("<div>").text(timestampText(node, run.completedAt || run.timestamp)).appendTo(card);
        $("<p>").text(german() ? run.summaryTextDe || run.summaryText || missing(node) : run.summaryText || missing(node)).appendTo(card);
        var devices = run.devices || [];
        $("<div>").text(devices.length + " " + label(node, "history.deviceResults", "device results", "Geräteergebnisse")).appendTo(card);
      });
    }
    function loadHistory(node, preserve) {
      var state = preserve ? viewState("#node-input-maintenance-history") : null;
      setState(node, "#node-input-maintenance-history", "loading", label(node, "history.loading", "Loading maintenance history…", "Wartungshistorie wird geladen…"));
      $.ajax({ url: "shelly-admin/nodes/" + encodeURIComponent(node.id) + "/maintenance/history?limit=50", type: "GET", dataType: "json", cache: false })
        .done(function (result) { renderHistory(node, result || {}); restoreViewState("#node-input-maintenance-history", state); })
        .fail(function (xhr) {
          var body = xhr.responseJSON || {};
          setState(node, "#node-input-maintenance-history", "error", body.error && body.error.message || label(node, "history.loadError", "Could not load maintenance history.", "Wartungshistorie konnte nicht geladen werden."));
        });
    }
    function activateTab(node, name) {
      node._shellyMaintenanceActiveTab = name;
      $(".shelly-maintenance-tab-button").each(function () {
        var active = $(this).attr("data-shelly-maintenance-tab") === name;
        $(this).toggleClass("active", active).attr("aria-selected", active ? "true" : "false");
      });
      $(".shelly-maintenance-tab-panel").each(function () {
        var active = $(this).attr("data-shelly-maintenance-panel") === name;
        $(this).toggle(active).attr("aria-hidden", active ? "false" : "true");
      });
      node._shellyMaintenanceLoadedTabs = node._shellyMaintenanceLoadedTabs || {};
      if (name === "status" && !node._shellyMaintenanceLoadedTabs.status) { node._shellyMaintenanceLoadedTabs.status = true; loadStatus(node, false); }
      if (name === "devices" && !node._shellyMaintenanceLoadedTabs.devices) { node._shellyMaintenanceLoadedTabs.devices = true; loadDevices(node, false); }
      if (name === "history" && !node._shellyMaintenanceLoadedTabs.history) { node._shellyMaintenanceLoadedTabs.history = true; loadHistory(node, false); }
    }
    RED.nodes.registerType("shelly-admin-maintenance", {
      category: "network",
      color: "#E5A93D",
      defaults: {
        name: { value: "" }, admin: { value: "", type: "shelly-admin-config", required: true }, action: { value: "check" },
        deviceSelectors: { value: "" }, allowAll: { value: false }, dryRun: { value: true }, firmwarePolicy: { value: "stable" },
        deviceTimeoutSeconds: { value: 15, validate: RED.validators.number() }, runTimeoutSeconds: { value: 900, validate: RED.validators.number() },
        staggerSeconds: { value: 30, validate: RED.validators.number() }, waitBeforeValidationSeconds: { value: 5, validate: RED.validators.number() },
        validationTimeoutSeconds: { value: 180, validate: RED.validators.number() }, conditionType: { value: "always" }, conditionValue: { value: "" },
        failFast: { value: false }, scheduleHours: { value: 0, validate: RED.validators.number() }, scheduleMode: { value: "notify" }, automaticUpdates: { value: false }
      },
      inputs: 1,
      outputs: 3,
      icon: "font-awesome/fa-wrench",
      outputLabels: function (index) { return text(this, ["shelly-admin-maintenance.output.result", "shelly-admin-maintenance.output.progress", "shelly-admin-maintenance.output.errors"][index], ["Result", "Progress", "Errors"][index]); },
      label: function () { return this.name || text(this, "shelly-admin-maintenance.label.default", "Shelly maintenance"); },
      paletteLabel: function () { return text(this, "shelly-admin-maintenance.label.palette", "Shelly maintenance"); },
      oneditprepare: function () {
        var node = this;
        node._shellyMaintenanceLoadedTabs = {};
        node._shellyMaintenanceDeviceData = null;
        node._shellyMaintenanceSelectedDeviceId = null;
        $("#node-input-manual-start").on("click.shellyAdmin", function () {
          var action = $("#node-input-action").val();
          var dryRun = $("#node-input-dryRun").prop("checked");
          var request = { action: action, dryRun: dryRun };
          if (!dryRun && (action === "update" || action === "reboot")) {
            if (!window.confirm(label(node, "confirm.destructive", "Run the selected maintenance action on the deployed node? This can cause outages.", "Ausgewählte Wartungsaktion auf der deployten Node ausführen? Dies kann Ausfälle verursachen."))) return;
            request.confirm = true;
          }

        });
        $("#node-input-manual-cancel").on("click.shellyAdmin", function () { postAction(node, { action: "cancel", reason: "editor-button" }); });
        $("#node-input-refresh-maintenance-status").on("click.shellyAdmin", function () { node._shellyMaintenanceLoadedTabs.status = true; loadStatus(node, true); });
        $("#node-input-refresh-maintenance-devices").on("click.shellyAdmin", function () { node._shellyMaintenanceLoadedTabs.devices = true; loadDevices(node, true); });
        $("#node-input-refresh-maintenance-history").on("click.shellyAdmin", function () { node._shellyMaintenanceLoadedTabs.history = true; loadHistory(node, true); });
        $("#node-input-maintenance-filter").on("change.shellyAdmin", function () {
          if (node._shellyMaintenanceDeviceData) renderDevices(node, node._shellyMaintenanceDeviceData, { filter: $(this).val(), selected: node._shellyMaintenanceSelectedDeviceId });
        });
        $(".shelly-maintenance-tab-button").on("click.shellyAdmin", function () { activateTab(node, $(this).attr("data-shelly-maintenance-tab")); });
        activateTab(node, "settings");
      }
    });
    if (typeof window !== "undefined") window.shellyAdminMaintenanceEditor = { activateTab: activateTab, renderStatus: renderStatus, renderDevices: renderDevices, renderHistory: renderHistory };
  }());
</script>

<script type="text/html" data-template-name="shelly-admin-maintenance">
  <div id="node-input-shelly-maintenance-tabs" class="shelly-maintenance-tabs" role="tablist" aria-label="Shelly maintenance views">
    <button type="button" id="node-input-maintenance-tab-settings" class="red-ui-button shelly-maintenance-tab-button active" data-shelly-maintenance-tab="settings" role="tab" aria-controls="node-input-maintenance-panel-settings" aria-selected="true"><span data-i18n="shelly-admin-maintenance.tabs.settings"></span></button>
    <button type="button" id="node-input-maintenance-tab-status" class="red-ui-button shelly-maintenance-tab-button" data-shelly-maintenance-tab="status" role="tab" aria-controls="node-input-maintenance-panel-status" aria-selected="false"><span data-i18n="shelly-admin-maintenance.tabs.status"></span></button>
    <button type="button" id="node-input-maintenance-tab-devices" class="red-ui-button shelly-maintenance-tab-button" data-shelly-maintenance-tab="devices" role="tab" aria-controls="node-input-maintenance-panel-devices" aria-selected="false"><span data-i18n="shelly-admin-maintenance.tabs.devices"></span></button>

<script type="text/html" data-help-name="shelly-admin-maintenance">
  <p>Checks firmware or performs guarded, sequential firmware updates and reboots. Dry-run is the default. Non-dry-run actions triggered by input require <code>msg.confirm === true</code>.</p>
  <p>The edit dialog contains four real views: <strong>Settings</strong>, <strong>Current Status</strong>, <strong>Device Overview</strong> and <strong>History</strong>. The read-only views use <code>shelly-admin.read</code>-protected Admin endpoints and never expose credentials. Each view loads once when first opened in the current dialog and then only through its visible Refresh button; there is no periodic editor refresh. Manual refresh preserves the selected filter, selected device and scroll position where possible.</p>
  <p><strong>Device Overview</strong> shows device name/model, ID, IP address, generation, reachability, current firmware, Stable/Beta availability under the selected policy, update eligibility, last firmware check, last update result, last successful and failed update attempts, errors/timeouts, post-update recovery and active/completed maintenance runs. Missing values are shown as <em>Not available</em>. Filters cover update available, error, offline, successfully updated and skipped.</p>
  <p><code>msg.action</code>: <code>start</code> (configured action), <code>check</code>, <code>update</code>, <code>reboot</code>, <code>cancel</code>, or <code>status</code>. Start and Cancel in the editor use the same deployed-node API. Real update/reboot requires explicit confirmation in the editor or <code>msg.confirm === true</code>.</p>
  <p>Select exact IDs, IPs or MAC addresses in <code>msg.devices</code> or the editor. An empty selection never means “all” unless <code>allowAll</code> is explicitly true. Conditions support restart-required, uptime, free-memory and firmware-available checks.</p>
  <p>Firmware update first checks every selected device, then runs update, stagger, restart wait and validation only for policy-eligible candidates. Ineligible devices finish as <code>skipped</code>/<code>no-policy-eligible-update</code>. Dry-run returns <code>plannedUpdates</code> without update or waiting. Progress separately reports checked, eligible, skipped, updated, failed and timeouts; update-phase progress counts candidates only. Reboots remain sequential. Schedule mode <em>Notify</em> only checks. Automatic updates require the dedicated option and non-dry-run configuration.</p>
  <p>Version 0.3.0 passes the configuration node's 250–60000 ms <em>Firmware Check Timeout</em> (default 2500 ms) unchanged to each complete firmware check and every Gen1/Gen2+ request. A firmware-check timeout or device error is counted and processing continues with every remaining device. Active HTTP requests, validation waits and stagger waits observe the abort signal. <em>Stable only</em> is the safe default; beta-only releases require explicit <em>Allow beta</em>.</p>
  <p>Real update and reboot requests create an expected-restart marker. Successful post-action validation uses the shared recovery lifecycle, clears one active reachability error at most once and preserves its resolution details.</p>
  <p><strong>⚠️ Use at your own risk – no warranty.</strong> Firmware updates, reboots, relay actions and automatic shutdown can cause outages, data loss, equipment/building damage or costs. APIs and firmware may change. Use dry-run first, select a small pilot group, stagger the rollout, maintain power/network stability and supervise the process. Unofficial community project, not affiliated with Shelly or Allterco; provided “as is”.</p>
</script>
