<script type="text/html" data-help-name="shelly-admin-maintenance">
  <p>Checks firmware or performs guarded, sequential firmware updates and reboots. Dry-run is the default. Non-dry-run actions triggered by input require <code>msg.confirm === true</code>.</p>
  <p>Select exact IDs, IPs or MAC addresses in <code>msg.devices</code> or the editor. An empty selection never means “all” unless <code>allowAll</code> is explicitly true. Conditions support restart-required, uptime, free-memory and firmware-available checks.</p>
  <p>Updates/reboots run one device at a time, wait for reachability and health data, then apply the configured stagger delay. Schedule mode <em>Notify</em> only checks. Automatic updates require the dedicated option and non-dry-run configuration.</p>
  <p><strong>⚠️ Use at your own risk – no warranty.</strong> Firmware updates, reboots, relay actions and automatic shutdown can cause outages, data loss, equipment/building damage or costs. APIs and firmware may change. Use dry-run first, select a small pilot group, stagger the rollout, maintain power/network stability and supervise the process. Unofficial community project, not affiliated with Shelly or Allterco; provided “as is”.</p>
</script>
