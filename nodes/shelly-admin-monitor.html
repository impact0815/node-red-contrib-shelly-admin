<script type="text/html" data-help-name="shelly-admin-monitor">
  <p>Polls inventoried devices for reachability, response time, temperature, overtemperature, Wi-Fi RSSI, uptime, memory/filesystem, firmware state and available electrical values.</p>
  <p>The normal Node-RED edit dialog contains four usable views: <strong>Settings</strong>, <strong>Current Findings</strong>, <strong>History</strong> and <strong>Device Details</strong>. The three read-only result views use <code>shelly-admin.read</code>-protected Admin endpoints and never return credentials. Each view loads once on its first selection in the current dialog and then only through its visible Refresh button; reopening the dialog starts a new one-time load cycle. There is no periodic editor refresh. Manual refresh preserves scroll position and the selected device where possible.</p>
  <p><strong>Current Findings</strong> groups human-readable cards into Firmware, Temperature, Offline/Recovery, Trends, Resources and Electrical observations. Cards show severity, title, model/device, IP address, explanation, current value, baseline/target, lifecycle and time. Critical, Warning, Info and Cleared states are visually distinct. Stable-only beta information remains informational; ordinary zero-power phases and normal load changes do not become electrical problem cards.</p>
  <p><strong>History</strong> shows a bounded latest-first list of opened, updated, present, cleared and Recovery entries rather than raw samples. <strong>Device Details</strong> also shows current uptime, uptime before the last reboot, reboot time/classification, effective reboot interval/mode/window with origin, and the next planned reboot. Missing measurements are displayed as not available, never as synthetic zeroes.</p>
  <p>Every Warning/Critical observation and finding card contains <code>uptimeSec</code> plus English/German human uptime text. Beta-only firmware notices are controlled by the Config node, default off, and when enabled open once per device/version.</p>
  <p>History is bounded and aggregated. Early-warning observations compare explicit current values with the device's own median/MAD baseline and, when enough comparable devices exist, peer medians. There is no opaque overall score and no guaranteed failure prediction.</p>
  <p><code>msg.action</code>: <code>start</code>/<code>poll</code>/<code>check</code>, <code>cancel</code>, <code>status</code>, <code>enable</code>, <code>disable</code>, <code>refresh-device</code>, <code>wait-device</code>, or confirmed <code>remove-device</code>. Message properties <code>automationMode</code>, <code>firmwarePolicy</code>, and <code>outputMode</code> override the editor values for one run. The editor buttons invoke the same deployed-node API. The existing Health, Alerts and Errors outputs and Observation Schema 2 remain unchanged; compact human summaries are additive.</p>
  <p>Device settings resolve as device override → class → general. Every observation includes <code>notify</code> and <code>deviceClass</code>; route external notifications only when <code>notify === true</code>. Device Details also shows class, active overrides and note/label.</p>
  <p><strong>Temperature safety:</strong> notifications are emitted first. An output can be switched off only in <em>Actions</em> mode and only when the exact device policy explicitly sets <code>autoShutdown:true</code>. No automatic re-enable occurs.</p>
    <p><strong>Device dropdown (0.5.1):</strong> one custom dropdown sits directly above details; the separate device button list is removed. It shows <code>Name · Type · IP</code>, <code>Type · Name · IP</code>, or <code>IP · Name · Type</code>, with the leading sort key bold. The type popover stays width-bounded inside the dialog and wraps long choices. Keyboard arrows, Enter, Escape and outside-click are supported. Sort and model/type multi-filter choices persist, and Refresh preserves them plus selection/scroll. Observations and human summaries carry the device name.</p>
<p><strong>⚠️ Use at your own risk – no warranty.</strong> This is not a certified fire-protection system and cannot replace smoke alarms, protective devices, supervision or professional electrical installation. Unofficial community project, not affiliated with Shelly or Allterco; provided “as is”.</p>
  <p><strong>Direct device actions:</strong> Reload all data performs a fresh probe. Failures show Retry, bounded Retry / Wait and confirmed Remove. Remove purges operational inventory/history state but deliberately retains class/override configuration for safe rediscovery.</p>
</script>
