<script type="text/html" data-help-name="shelly-admin-monitor">
  <p>Polls inventoried devices for reachability, response time, temperature, overtemperature, Wi-Fi RSSI, uptime, memory/filesystem, firmware state and available electrical values.</p>
  <p>History is bounded and aggregated. Early-warning observations compare explicit current values with the device's own median/MAD baseline and, when enough comparable devices exist, peer medians. Every observation includes reasons, baseline, deviation, confidence and data quality. There is no opaque overall score and no guaranteed failure prediction.</p>
  <p>Firmware/configuration changes start a warm-up period. Minimum samples, consecutive breaches, hysteresis, cooldown and missing-value handling reduce false alerts.</p>
  <p>Version 0.2.0 emits Observation Schema 2 lifecycle states (<code>opened</code>, <code>present</code>, <code>updated</code>, <code>cleared</code>, <code>suppressed</code>) for firmware, offline/recovered, restart, temperature, latency, resource and conservative electrical observations. Select current state, transitions, or both without changing the existing three-output wiring.</p>
  <p><strong>Temperature safety:</strong> notifications are emitted first. An output can be switched off only in <em>Actions</em> mode and only when the exact device policy explicitly sets <code>autoShutdown:true</code>. No automatic re-enable occurs.</p>
  <p><strong>⚠️ Use at your own risk – no warranty.</strong> This is not a certified fire-protection system and cannot replace smoke alarms, protective devices, supervision or professional electrical installation. Unofficial community project, not affiliated with Shelly or Allterco; provided “as is”.</p>
